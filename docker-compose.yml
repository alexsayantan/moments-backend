services:
  postgres:
    image: postgres:17-alpine
    container_name: moments-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - moments-network

  redis:
    image: redis:7-alpine
    container_name: moments-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - moments-network

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: moments-user-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "User Service"
      APP_VERSION: "v1"
      APP_DESCRIPTION: "User Management Service"
      DATABASE_URL: "postgresql+psycopg://postgres:postgrespassword@postgres:5432/user_db"
      REDIS_URL: "redis://redis:6379/0"
      ECHO_SQL: "false"
      JWT_SECRET_KEY: "moments-local-dev-jwt-secret-key-at-least-32-chars-long"
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 2
      DB_POOL_TIMEOUT: 30
      DB_POOL_RECYCLE: 300
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moments-network

volumes:
  postgres_data:
    driver: local

networks:
  moments-network:
    driver: bridge

[project]
name = "common-auth"
version = "0.1.0"
description = "Shared JWT authentication and authorization library for Moments microservices"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyjwt[crypto]>=2.10.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "fastapi>=0.115.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
